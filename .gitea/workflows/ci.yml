# Gitea Actions CI (forge-only: .gitea/workflows/ is invisible to GitHub, so
# the push-mirror does not double-run this). Mirrors `make check` minus the
# local memcap wrapper.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      # .golangci.yml is v2-format; action v7 targets golangci-lint v2.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
